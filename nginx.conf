server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compressão: reduz ~536KB de JS/CSS para ~130KB
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/xml application/xml+rss application/rss+xml;

  # SPA fallback
  location / { try_files $uri $uri/ /index.html; }

  # index.html nunca é cacheado (sempre traz o ?v=N mais novo)
  location ~* \.html$ { add_header Cache-Control "no-cache"; }

  # JS/CSS levam ?v=N no HTML: cada deploy é uma URL nova, então pode cachear forte
  location ~* \.(css|js)$ { add_header Cache-Control "public, max-age=604800, immutable"; }

  # mídia e fontes: cache longo
  location ~* \.(svg|jpg|jpeg|png|webp|gif|ico|pdf|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }
}
