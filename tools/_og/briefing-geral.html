<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Fonte do OG do formulário de briefing (briefing/og-image.png). -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#000;color:#fff;font-family:"Geist",sans-serif;position:relative;overflow:hidden}
body::before{content:"";position:absolute;right:-200px;top:-260px;width:820px;height:820px;border-radius:50%;
  background:radial-gradient(circle,rgba(241,85,50,.22) 0%,rgba(241,85,50,0) 66%)}
body::after{content:"";position:absolute;left:-260px;bottom:-360px;width:760px;height:760px;border-radius:50%;
  background:radial-gradient(circle,rgba(241,85,50,.12) 0%,rgba(241,85,50,0) 66%)}
.barra{position:absolute;left:0;top:0;width:456px;height:5px;background:#F15532}
.col{position:absolute;left:90px;top:70px;right:90px;z-index:1}
.logo{height:52px;display:block}
.chip{display:inline-flex;align-items:center;gap:12px;margin-top:36px;font-size:17px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:#d9d9dc;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.03);border-radius:999px;padding:12px 24px}
.chip b{width:9px;height:9px;border-radius:50%;background:#F15532;display:block}
h1{margin-top:28px;font-family:"Clash Display",sans-serif;font-weight:600;font-size:90px;line-height:1.02;letter-spacing:-.02em}
h1 em{font-style:normal;color:#F15532}
p{margin-top:24px;font-size:24px;line-height:1.45;color:#a7a7ad}
.pe{position:absolute;left:90px;right:90px;bottom:44px;display:flex;justify-content:space-between;font-size:17px;color:#8e8e94;z-index:1}
.pe b{color:#e6e6e8;font-weight:700}
</style></head><body>
<div class="barra"></div>
<div class="col">
  <img class="logo" src="../../assets/logo-branca.svg" alt="">
  <div class="chip"><b></b>Briefing de projeto</div>
  <h1>Seu projeto começa<br><em>aqui.</em></h1>
  <p>Site institucional, landing page, página de vendas ou onepage.<br>Responda em menos de 10 minutos.</p>
</div>
<div class="pe"><span>Desenvolvido por: <b>OutBox Group</b></span><span>www.outboxgroup.com.br</span></div>
</body></html>
