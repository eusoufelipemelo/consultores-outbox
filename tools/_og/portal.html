<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Fonte do OG do Portal do Consultor (assets/og-image.jpg). Antes era só a
     imagem, sem origem; agora se regera renderizando este arquivo em 1200x630. -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0a0a0b;color:#fff;font-family:"Geist",sans-serif;position:relative;overflow:hidden}
.brilho{position:absolute;right:-120px;top:-170px;width:760px;height:760px;border-radius:50%;
  background:radial-gradient(circle,rgba(241,85,50,.55) 0%,rgba(241,85,50,.16) 38%,rgba(241,85,50,0) 68%)}
.grade{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px}
.moldura{position:absolute;inset:28px;border:1px solid rgba(255,255,255,.09);border-radius:26px}
.col{position:absolute;left:82px;top:70px;right:82px}
.logo{height:68px;display:block}
.selo{margin-top:26px;font-size:22px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#F15532}
h1{margin-top:14px;font-size:76px;line-height:1.01;font-weight:800;letter-spacing:-.035em}
h1 em{font-style:normal;color:#F15532}
p{margin-top:24px;font-size:26px;line-height:1.45;color:#b9b9bd;max-width:860px}
.pilula{position:absolute;left:82px;bottom:76px;display:inline-flex;align-items:center;gap:12px;
  background:#F15532;color:#fff;font-size:23px;font-weight:700;border-radius:14px;padding:16px 26px;
  box-shadow:0 10px 40px rgba(241,85,50,.45)}
.pilula b{width:9px;height:9px;border-radius:50%;background:#fff;display:block}
.pe{position:absolute;right:82px;bottom:80px;text-align:right;font-size:18px;line-height:1.55;color:#8e8e94;font-weight:500}
</style></head><body>
<div class="brilho"></div><div class="grade"></div><div class="moldura"></div>
<div class="col">
  <img class="logo" src="../../assets/logo-branca.svg" alt="">
  <div class="selo">Portal do Consultor</div>
  <h1>Venda mais.<br>Acompanhe sua <em>comissão</em>.</h1>
  <p>Funil, orçamentos, comissões, prêmios e metas, tudo em tempo real, em um só lugar.</p>
</div>
<div class="pilula"><b></b>consultores.outboxgroup.com.br</div>
<div class="pe">Programa de Consultores<br>OutBox Soluções Digitais</div>
</body></html>
